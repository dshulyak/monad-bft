[package]
name = "monad-cluster-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
monad-crypto = { workspace = true }
monad-dataplane = { workspace = true }
monad-executor = { workspace = true }
monad-executor-glue = { workspace = true }
monad-node-config = { workspace = true }
monad-peer-discovery = { workspace = true }
monad-raptorcast = { workspace = true }
monad-router-multi = { workspace = true }
monad-secp = { workspace = true }
monad-types = { workspace = true }
monad-wireauth = { workspace = true }

alloy-rlp = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
eyre = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
humantime = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
opentelemetry-otlp = { workspace = true, features = ["metrics", "grpc-tonic"] }
opentelemetry-semantic-conventions = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tikv-jemallocator = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[bin]]
name = "cluster"
path = "src/main.rs"
