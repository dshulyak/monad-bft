[package]
name = "monad-raptorcast"
version = "0.1.0"
edition = "2021"

# this is necessary for criterion bench options
# https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
[lib]
bench = false

[dependencies]
monad-compress = { workspace = true }
monad-crypto = { workspace = true }
monad-dataplane = { workspace = true }
monad-executor = { workspace = true }
monad-executor-glue = { workspace = true }
monad-merkle = { workspace = true }
monad-node-config = { workspace = true }
monad-peer-discovery = { workspace = true }
monad-raptor = { workspace = true }
monad-secp = { workspace = true }
monad-types = { workspace = true }
monad-validator = { workspace = true }
monad-wireauth-api = { workspace = true }
monad-wireauth-protocol = { workspace = true }

alloy-rlp = { workspace = true }
bitvec = { workspace = true }
bytes = { workspace = true }
fixed = { workspace = true}
futures = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true }
iset = { workspace = true }
itertools = { workspace = true }
lru = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
zerocopy = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures-util = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-manytrace = { workspace = true }
agent = { workspace = true }
tikv-jemallocator = { workspace = true }

[dev-dependencies]
monad-testutil = { workspace = true }

rstest = { workspace = true }
criterion = { workspace = true }
insta = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[[bench]]
name = "raptor_bench"
harness = false

[[example]]
name = "service"
